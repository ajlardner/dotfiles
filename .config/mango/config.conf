# input
xkb_rules_layout=us,latam
xkb_rules_options=grp:alt_space_toggle
mouse_accel_speed=0
sloppy_focus=1
cursor_size=24

# monitors
monitor_rule=name:^DP-3$,x:0,y:420
monitor_rule=name:^HDMI-A-2$,x:1920,y:420,primary:1
monitor_rule=name:^DP-4$,x:3840,y:0,rr:1
monitor_rule=name:^DP-5$,x:4920,y:0,rr:3
monitor_rule=name:^HDMI-A-1$,x:6000,y:0,rr:1
monitor_rule=name:^DP-1$,x:7080,y:420

# styling
root_color=0x221f22ff
border_px=2
focus_color=0xa9dc76ee
urgent_color=0xff6188ff
gap_inner_horizontal=4
gap_inner_vertical=4
gap_outer_horizontal=4
gap_outer_vertical=4
unfocused_opacity=0.85

# layout
tag_rule=id:*,layout_name:vertical_scroller
scroller_default_proportion=1.0
scroller_proportion_preset=0.5,1.0
scroller_structs=0 
window_rule=scroller_proportion:1.0,app_id:^(librewolf|vesktop)$

# startup
exec_once=qs

# keybinds
# window management
bind=SUPER,Q,togglefloating
bind=SUPER,W,killclient
bind=SUPER,E,togglefullscreen
bind=SUPER,C,switch_proportion_preset
bind=SUPER,space,toggleoverview
bind=SUPER,A,spawn,rofi -show drun
bind=SUPER,S,spawn,foot
bind=SUPER,D,spawn,foot yazi
bind=SUPER,F,spawn,librewolf
bind=SUPER,period,spawn,rofi-rbw
bind=SUPER,equal,quit

# selecting windows
bind=SUPER,H,focusmon,left
bind=SUPER,J,focusdir,down
bind=SUPER,K,focusdir,up
bind=SUPER,L,focusmon,right
bind=SUPER,Left,focusdir,left
bind=SUPER,Down,viewtoright
bind=SUPER,Up,viewtoleft
bind=SUPER,Right,focusdir,right
bind=SUPER,Y,focusmon,left
bind=SUPER,O,focusmon,right

# moving windows
bind=SUPER+SHIFT,H,tagmon,left
bind=SUPER+SHIFT,J,tagtoright
bind=SUPER+SHIFT,K,tagtoleft
bind=SUPER+SHIFT,L,tagmon,right
bind=SUPER+SHIFT,Left,move_client,left
bind=SUPER+SHIFT,Down,move_client,down
bind=SUPER+SHIFT,Up,move_client,up
bind=SUPER+SHIFT,Right,move_client,right

# screenshots
bind=NONE,Print,spawn,$HOME/.config/mango/screenshot.sh region
bind=CTRL,Print,spawn,$HOME/.config/mango/screenshot.sh output
bind=ALT,Print,spawn,$HOME/.config/mango/screenshot.sh window

# media keys
bindl=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindl=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl=NONE,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindl=NONE,XF86AudioNext,spawn,playerctl next
bindl=NONE,XF86AudioPause,spawn,playerctl play-pause
bindl=NONE,XF86AudioPlay,spawn,playerctl play-pause
bindl=NONE,XF86AudioPrev,spawn,playerctl previous
